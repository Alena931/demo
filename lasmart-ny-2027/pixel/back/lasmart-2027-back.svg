<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="148.0mm" height="210.0mm" viewBox="0 0 148.0 210.0">
<title>Lasmart 2027 — оборот</title>
<rect width="148" height="210" fill="#FFFFFF"/>
<text x="74.00" y="48.80" fill="#2C2864" font-family="Inter" font-size="4.35" font-weight="500" text-anchor="middle">Дорогие партнёры!</text>
<text x="74.00" y="64.20" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">Команда Lasmart поздравляет вас</text>
<text x="74.00" y="70.35" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">с Новым годом! Пусть 2027 принесёт</text>
<text x="74.00" y="76.50" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">новые возможности, уверенность</text>
<text x="74.00" y="82.65" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">и поводы для профессиональной</text>
<text x="74.00" y="88.80" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">гордости.</text>
<text x="74.00" y="102.15" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">Ваше доверие и готовность идти</text>
<text x="74.00" y="108.30" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">вместе — то, что помогает нам</text>
<text x="74.00" y="114.45" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">находить верные взаимосвязи.</text>
<text x="74.00" y="120.60" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">Каждый новый проект — возможность</text>
<text x="74.00" y="126.75" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">расти рядом с вами, преодолевать</text>
<text x="74.00" y="132.90" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">вызовы и задавать новые стандарты</text>
<text x="74.00" y="139.05" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">в IT-индустрии.</text>
<text x="74.00" y="152.40" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">Мы ценим наше партнёрство, вместе</text>
<text x="74.00" y="158.55" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">мы создаём IT-реальность будущего!</text>
<text x="74.00" y="178.20" fill="#2C2864" font-family="Noto Serif Display" font-size="5.40" font-weight="400" text-anchor="middle" font-style="italic">С наилучшими пожеланиями,</text>
<text x="74.00" y="186.40" fill="#2C2864" font-family="Noto Serif Display" font-size="5.40" font-weight="400" text-anchor="middle" font-style="italic">команда Lasmart</text>
</svg>
