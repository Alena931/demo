<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="148.0mm" height="210.0mm" viewBox="0 0 148.0 210.0">
<title>Lasmart 2027 — оборот</title>
<rect width="148" height="210" fill="#FFFFFF"/>
<text x="74.00" y="48.80" fill="#2C2864" font-family="Inter" font-size="4.35" font-weight="500" text-anchor="middle">Дорогие партнёры!</text>
<text x="74.00" y="64.20" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">Поздравляем с Новым годом!</text>
<text x="74.00" y="70.35" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">Пусть 2027 принесёт ясность</text>
<text x="74.00" y="76.50" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">в данных, лёгкость в решениях</text>
<text x="74.00" y="82.65" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">и тепло в рабочих днях.</text>
<text x="74.00" y="96.00" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">С вами мы собираем из данных</text>
<text x="74.00" y="102.15" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">цельную картину и делаем IT</text>
<text x="74.00" y="108.30" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">опорой, а не фоном. Спасибо</text>
<text x="74.00" y="114.45" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">за доверие смотреть так близко.</text>
<text x="74.00" y="120.60" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">Эту честь бережём в каждой задаче.</text>
<text x="74.00" y="133.95" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">Пусть год будет светлым,</text>
<text x="74.00" y="140.10" fill="#2C2864" font-family="Inter" font-size="4.15" font-weight="400" text-anchor="middle">а общее дело — в радость.</text>
<text x="74.00" y="178.20" fill="#2C2864" font-family="Noto Serif Display" font-size="5.40" font-weight="400" text-anchor="middle" font-style="italic">С наилучшими пожеланиями,</text>
<text x="74.00" y="186.40" fill="#2C2864" font-family="Noto Serif Display" font-size="5.40" font-weight="400" text-anchor="middle" font-style="italic">команда Lasmart</text>
</svg>
